<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save your clips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0A0B; color: #EDEDE8; font-family: Geist, Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <dc-import name="Archive" hint-size="390px,844px"></dc-import>
  </div>
  <div style="position: absolute; inset: 0; background: #000000B3"></div>

  <sc-if value="{{isOptions}}" hint-placeholder-val="{{ true }}">
    <div role="dialog" aria-label="Save your seconds" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 32px 32px 0 0; background: #18181B; border-top: 1px solid #3A3A40; padding: 10px 20px 36px; display: flex; flex-direction: column; gap: 10px">
      <div style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A3A40; margin-bottom: 10px"></div>
      <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8E8E88">129 SECONDS · ONLY ON THIS PHONE</span>
      <span style="font-family: Geist, Inter, system-ui, sans-serif; font-size: 32px; line-height: 1; font-weight: 600; letter-spacing: -0.02em">Save your clips.</span>
      <span style="font-size: 15px; line-height: 1.5; color: #B9B9B3; padding-bottom: 8px">If this phone breaks or gets lost, they're gone. Back them up to a private folder in your own Google Drive — we never store your videos.</span>
      <a href="DriveConnect.dc.html" style="height: 54px; border-radius: 27px; background: #EDEDE8; color: #0A0A0B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 16px">Continue with Google</a>
      <a href="ProjectHub.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; color: #8E8E88; text-decoration: none; font-size: 15px">Not now</a>
    </div>
  </sc-if>

  <sc-if value="{{isEmail}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="Sign up with email" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 32px 32px 0 0; background: #18181B; border-top: 1px solid #3A3A40; padding: 10px 20px 36px; display: flex; flex-direction: column; gap: 12px">
      <div style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A3A40; margin-bottom: 10px"></div>
      <span style="font-family: Geist, Inter, system-ui, sans-serif; font-size: 26px; line-height: 1; font-weight: 600; letter-spacing: -0.02em">Sign up with email</span>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #B9B9B3">Email
        <input type="email" placeholder="you@example.com" style="height: 50px; box-sizing: border-box; border-radius: 14px; border: 1px solid #3A3A40; background: #111113; color: #EDEDE8; padding: 0 14px; font-family: Geist, sans-serif; font-size: 16px">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #B9B9B3">Password
        <input type="password" placeholder="At least 8 characters" style="height: 50px; box-sizing: border-box; border-radius: 14px; border: 1px solid #3A3A40; background: #111113; color: #EDEDE8; padding: 0 14px; font-family: Geist, sans-serif; font-size: 16px">
      </label>
      <a href="DriveConnect.dc.html" style="height: 54px; margin-top: 6px; border-radius: 27px; background: #FF8A3D; color: #0A0A0B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 16px">Create account</a>
      <button onClick="{{back}}" style="height: 44px; border: 0; background: transparent; color: #8E8E88; font-family: Geist, sans-serif; font-size: 15px">Back</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { email: false }; }
  renderVals() {
    return {
      isOptions: !this.state.email, isEmail: this.state.email,
      showEmail: () => this.setState({ email: true }), back: () => this.setState({ email: false })
    };
  }
}
</script>
</body>
</html>
