<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera v1.1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0}
@keyframes sv-breathe{0%,100%{opacity:1}50%{opacity:.78}}
.sv-breathe{animation:sv-breathe 1600ms ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sv-breathe{animation:none}}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #050505; color: #EDEDE8; font-family: Geist, Inter, system-ui, sans-serif; user-select: none">

  <!-- viewfinder -->
  <div style="position: absolute; inset: 0; background: radial-gradient(70% 45% at 70% 28%, #C99A6A 0%, #6B4A30 35%, #241812 70%, #0C0907 100%)">
    <div style="position: absolute; left: 228px; top: 120px; width: 120px; height: 200px; border-radius: 6px; background: linear-gradient(180deg, #F2D6B0 0%, #B98A5E 100%); opacity: 0.85"></div>
    <div style="position: absolute; left: 60px; top: 300px; width: 92px; height: 92px; border-radius: 46px; background: #140E0A"></div>
    <div style="position: absolute; left: 32px; top: 380px; width: 150px; height: 320px; border-radius: 75px 75px 0 0; background: #140E0A"></div>
  </div>
  <sc-if value="{{grid}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 130px; top: 0; width: 1px; height: 844px; background: #FFFFFF33"></div>
    <div style="position: absolute; left: 260px; top: 0; width: 1px; height: 844px; background: #FFFFFF33"></div>
    <div style="position: absolute; left: 0; top: 281px; width: 390px; height: 1px; background: #FFFFFF33"></div>
    <div style="position: absolute; left: 0; top: 562px; width: 390px; height: 1px; background: #FFFFFF33"></div>
  </sc-if>
  <!-- 16:9 band for a Cinema project held upright -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 232px; background: #000000A6"></div>
  <div style="position: absolute; left: 0; right: 0; top: 451px; height: 393px; background: #000000A6"></div>
  <div style="position: absolute; left: 0; right: 0; top: 232px; height: 219px; box-sizing: border-box; border-top: 1px solid #EDEDE866; border-bottom: 1px solid #EDEDE866"></div>
  <!-- tap to focus · long-press = AE/AF lock -->
  <div onPointerDown="{{fDown}}" onPointerUp="{{fUp}}" onPointerLeave="{{fUp}}" aria-label="Viewfinder. Tap to focus, hold to lock focus and exposure" style="position: absolute; left: 0; right: 0; top: 104px; height: 460px; touch-action: none">
    <sc-if value="{{focusOn}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: {{fx}}px; top: {{fy}}px; width: {{fs}}px; height: {{fs}}px; margin-left: {{fm}}px; margin-top: {{fm}}px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{fColor}}; box-shadow: {{fGlow}}; opacity: {{fOp}}; transition: width 220ms cubic-bezier(.2,.8,.2,1), height 220ms cubic-bezier(.2,.8,.2,1), margin 220ms cubic-bezier(.2,.8,.2,1), opacity 400ms ease, border-color 200ms; pointer-events: none">
        <span style="position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 2px; background: {{fColor}}"></span>
      </div>
      <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
        <span style="position: absolute; left: {{fx}}px; top: {{ly}}px; transform: translateX(-50%); height: 24px; padding: 0 10px; border-radius: 12px; background: #EDEDE8; color: #0A0A0B; display: flex; align-items: center; font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.1em; font-weight: 500; white-space: nowrap; pointer-events: none">AE/AF LOCK</span>
      </sc-if>
    </sc-if>
  </div>

  <sc-if value="{{hint}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; top: 182px; display: flex; justify-content: center">
      <span style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px; background: #EDEDE8; color: #0A0A0B; font-size: 13px; font-weight: 500">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"></rect><path d="M20 14a6 6 0 0 1-5 6M18 20h-3v-3"></path></svg>
        Turn sideways for the full frame
      </span>
    </div>
  </sc-if>

  <sc-if value="{{rec}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 182px; display: flex; justify-content: center">
      <span role="timer" aria-label="{{recAria}}" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px; background: #050505B3; border: 1px solid {{recBorder}}; font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: 0.06em; color: {{recColor}}; transition: color 200ms, border-color 200ms">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #FF3B30"></span>{{recTime}}<span style="font-size: 10px; letter-spacing: 0.12em; visibility: {{okVis}}">· CLIP OK</span>
      </span>
    </div>
  </sc-if>

  <!-- top scrim: keeps chips readable on any video -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(180deg, #000000B3 0%, #00000059 55%, #00000000 100%); pointer-events: none"></div>

  <!-- top: close back to the project (home). No project / Today chips: the camera only films. -->
  <a href="ProjectHub.dc.html" aria-label="Close camera" style="position: absolute; left: 12px; top: 52px; width: 44px; height: 44px; border-radius: 22px; background: #0000008C; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>

  <!-- golden hour: only when coarse location was allowed; hidden otherwise, never asks twice -->
  <sc-if value="{{ghShow}}" hint-placeholder-val="{{ true }}">
    <span role="status" style="position: absolute; left: 64px; right: 112px; top: 52px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: Geist, sans-serif; font-size: 13px; font-weight: 500; color: {{ghColor}}; white-space: nowrap; visibility: {{idleVis}}">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 5v3M4.9 9.9l2.1 2.1M19.1 9.9L17 12"></path></svg>{{ghText}}
    </span>
  </sc-if>

  <!-- tools row, in thumb reach -->
  <div style="position: absolute; right: 12px; top: 52px; display: flex; gap: 8px; visibility: {{idleVis}}">
    <sc-for list="{{tools}}" as="t" hint-placeholder-count="4">
      <button onClick="{{t.tap}}" aria-pressed="{{t.on}}" aria-label="{{t.n}}" style="width: 44px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: {{t.color}}">
        <span style="width: 44px; height: 44px; border-radius: 22px; background: #0000008C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg></span>
      </button>
    </sc-for>
  </div>
  <sc-if value="{{more}}" hint-placeholder-val="{{ false }}">
    <div onClick="{{toggleMore}}" style="position: absolute; inset: 0"></div>
    <div role="menu" style="position: absolute; right: 12px; top: 104px; width: 180px; border-radius: 16px; background: #18181BF2; border: 1px solid #3A3A40; padding: 4px; box-shadow: 0 12px 40px #000000">
      <button onClick="{{toggleGrid}}" role="menuitemcheckbox" aria-checked="{{gridStr}}" style="width: 100%; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: #EDEDE8; font-family: Geist, sans-serif; font-size: 15px">Grid<span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{gridColor}}">{{gridState}}</span></button>
    </div>
  </sc-if>

  <!-- mode: plain words, no pill. Active = white + dot under it -->
  <div role="radiogroup" aria-label="Capture mode" style="position: absolute; left: 0; right: 0; top: 664px; display: flex; justify-content: center; gap: 28px; visibility: {{idleVis}}; font-family: Geist, sans-serif; font-size: 15px; font-weight: 500">
    <button onClick="{{setPhoto}}" role="radio" aria-checked="{{photoOn}}" style="height: 36px; border: 0; background: transparent; padding: 0; color: {{photoColor}}; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px">Photo<span style="width: 4px; height: 4px; border-radius: 2px; background: {{photoDot}}"></span></button>
    <button onClick="{{setVideo}}" role="radio" aria-checked="{{videoOn}}" style="height: 36px; border: 0; background: transparent; padding: 0; color: {{videoColor}}; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px">Video<span style="width: 4px; height: 4px; border-radius: 2px; background: {{videoDot}}"></span></button>
  </div>

  <!-- capture row -->
  <div style="position: absolute; left: 0; right: 0; top: 712px; height: 88px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; box-sizing: border-box">
    <a href="PickerV2.dc.html" aria-label="Add from gallery" style="visibility: {{idleVis}}; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #EDEDE8; text-decoration: none">
      <span style="width: 52px; height: 52px; border-radius: 26px; background: #FFFFFF1A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="2"></rect><path d="M3 15l4-4 4 4 2-2 4 4"></path><path d="M19 3v6M16 6h6"></path></svg></span>
      <span style="font-family: Geist, sans-serif; font-size: 12px; font-weight: 500; line-height: 16px">Add</span>
    </a>
    <!-- record button: option D "Ember" -->
    <sc-if value="{{videoIdle}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{startRec}}" aria-label="Start recording" style="width: 80px; height: 80px; border: 0; border-radius: 40px; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 72px; height: 72px; border-radius: 36px; background: #FF3B30; box-shadow: none"></span></button>
    </sc-if>
    <sc-if value="{{photoIdle}}" hint-placeholder-val="{{ false }}">
      <a href="EditClipV2.dc.html" aria-label="Take photo" style="width: 80px; height: 80px; border-radius: 40px; display: flex; align-items: center; justify-content: center"><span style="width: 72px; height: 72px; border-radius: 36px; background: #EDEDE8; box-shadow: 0 0 16px #FFFFFF33"></span></a>
    </sc-if>
    <sc-if value="{{rec}}" hint-placeholder-val="{{ false }}">
      <a href="EditClipV2.dc.html" aria-label="Stop recording" style="width: 80px; height: 80px; border-radius: 40px; display: flex; align-items: center; justify-content: center"><span class="sv-breathe" style="width: 72px; height: 72px; border-radius: 36px; background: #FF3B30; display: flex; align-items: center; justify-content: center"><span style="width: 24px; height: 24px; border-radius: 6px; background: #0A0A0B"></span></span></a>
    </sc-if>
    <button onClick="{{flip}}" aria-label="Switch camera" style="visibility: {{idleVis}}; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: #EDEDE8">
      <span style="width: 52px; height: 52px; border-radius: 26px; background: #FFFFFF1A; display: flex; align-items: center; justify-content: center; transform: rotate({{flipDeg}}deg); transition: transform 240ms ease"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"></path></svg></span>
      <span style="font-family: Geist, sans-serif; font-size: 12px; font-weight: 500; line-height: 16px">{{lensLabel}}</span>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"golden":{"editor":"enum","options":["soon","now","off"],"default":"soon"},"saved":{"editor":"boolean","default":false},"recording":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { grid: false, timer: 0, flash: false, mode: 'video', front: false, flipDeg: 0, rec: !!(props && props.recording), sec: (props && props.recording) ? 3 : 0, f: null, fBig: false, fDim: false, lock: false }; }
  focusAt(e) {
    const r = e.currentTarget.getBoundingClientRect(), sc = r.width / 390;
    const x = (e.clientX - r.left) / sc, y = (e.clientY - r.top) / sc;
    clearTimeout(this._ft1); clearTimeout(this._ft2); clearTimeout(this._lt);
    this.setState({ f: { x, y }, fBig: true, fDim: false, lock: false });
    this._ft1 = setTimeout(() => this.setState({ fBig: false }), 30);
    this._lt = setTimeout(() => this.setState({ lock: true }), 600);
  }
  focusUp() {
    clearTimeout(this._lt);
    if (!this.state.f || this.state.lock) return;
    this._ft2 = setTimeout(() => this.setState({ fDim: true }), 1200);
  }
  startRec() {
    this.setState({ rec: true, sec: 0 });
    if (this._iv) clearInterval(this._iv);
    this._iv = setInterval(() => { if (!this.state.rec || this.state.sec >= 59) { clearInterval(this._iv); return; } this.setState({ sec: this.state.sec + 1 }); }, 1000);
  }
  renderVals() {
    const st = this.state;
    const saved = !!this.props.saved;
    const video = st.mode === 'video';
    const rec = st.rec, ok = st.sec >= 1;
    return {
      saved, hint: !saved && !rec, grid: st.grid,
      rec, videoIdle: video && !rec, photoIdle: !video && !rec, idleVis: rec ? 'hidden' : 'visible',
      startRec: () => this.startRec(),
      ghShow: (this.props.golden || 'soon') !== 'off', ghColor: this.props.golden === 'now' ? '#EDEDE8' : '#FFFFFFD9',
      ghText: this.props.golden === 'now' ? 'Golden hour now · 24 min left' : 'Golden hour in 38 min',
      fDown: (e) => this.focusAt(e), fUp: () => this.focusUp(),
      focusOn: !!st.f && !rec, fx: st.f ? st.f.x.toFixed(0) : 0, fy: st.f ? st.f.y.toFixed(0) : 0, ly: st.f ? (st.f.y - 54).toFixed(0) : 0,
      fs: st.fBig ? 88 : 64, fm: st.fBig ? -44 : -32, locked: st.lock,
      fColor: st.lock ? '#EDEDE8' : '#FFFFFF', fGlow: st.lock ? 'none' : '0 0 6px #00000066', fOp: st.fDim && !st.lock ? 0.35 : 1,
      calAria: (saved ? 'Today has a clip. ' : '') + 'Open the calendar of this project',
      recTime: '0:' + String(st.sec).padStart(2, '0'), recColor: ok ? '#FF3B30' : '#B9B9B3', recBorder: ok ? '#FF3B3066' : '#3A3A40', okVis: ok ? 'visible' : 'hidden',
      recAria: 'Recording, ' + st.sec + ' seconds' + (ok ? ', clip is long enough' : ''),
      tools: [
        { n: st.flash ? 'Light on' : 'Light', on: String(st.flash), color: st.flash ? '#EDEDE8' : '#EDEDE8', tap: () => this.setState({ flash: !st.flash }), icon: 'M13 3L5 14h6l-1 7 8-11h-6l1-7z' },
        { n: 'More', on: String(st.more), color: '#EDEDE8', tap: () => this.setState({ more: !st.more }), icon: 'M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0 M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0 M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0' }
      ],
      more: !!st.more && !rec, toggleMore: () => this.setState({ more: false }),
      toggleGrid: () => this.setState({ grid: !st.grid, more: false }), gridStr: String(st.grid), gridState: st.grid ? 'ON' : 'OFF', gridColor: st.grid ? '#EDEDE8' : '#8E8E88',
      setPhoto: () => this.setState({ mode: 'photo' }), setVideo: () => this.setState({ mode: 'video' }),
      photoOn: String(!video), photoColor: video ? '#FFFFFF99' : '#FFFFFF', photoDot: video ? 'transparent' : '#FFFFFF',
      videoOn: String(video), videoColor: video ? '#FFFFFF' : '#FFFFFF99', videoDot: video ? '#FFFFFF' : 'transparent',
      flip: () => this.setState({ front: !st.front, flipDeg: st.flipDeg + 180 }),
      flipDeg: st.flipDeg, lensLabel: 'Flip'
    };
  }
}
</script>
</body>
</html>
