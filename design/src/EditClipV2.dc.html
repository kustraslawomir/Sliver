<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit clip v1.1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
@keyframes slSweep{0%{left:-4px}100%{left:100%}}
@keyframes slBar{from{width:0%}to{width:100%}}
.sl-sweep{animation:slSweep 1.4s cubic-bezier(0.3,0,0,1) infinite}
.sl-bar{animation:slBar 1s linear infinite}
@media (prefers-reduced-motion: reduce){.sl-sweep,.sl-bar{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #050505; color: #EDEDE8; font-family: Geist, Inter, system-ui, sans-serif; user-select: none">

  <!-- header -->
  <div style="position: absolute; left: 12px; right: 12px; top: 50px; height: 48px; display: flex; align-items: center; justify-content: space-between">
    <a href="CameraV2.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <button style="height: 36px; padding: 0 12px 0 14px; border-radius: 18px; border: 1px solid #26262A; background: #111113; color: #EDEDE8; display: flex; align-items: center; gap: 6px; font-family: Geist, sans-serif; font-size: 14px; font-weight: 500">Today<span style="font-family: Geist, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; color: #8E8E88">Tue 10 Nov</span><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
    <button onClick="{{toggleSound}}" aria-label="{{soundLabel}}" aria-pressed="{{soundOn}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: {{soundColor}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="{{soundPath}}"></path></svg></button>
  </div>

  <!-- READY -->
  <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 20px; top: 196px; width: 350px; height: 197px; border-radius: 12px; overflow: hidden; background: radial-gradient(60% 80% at 45% 40%, #C99A6A 0%, #6B4A30 40%, #241812 75%, #0C0907 100%)">
      <div style="position: absolute; left: 70px; top: 22px; width: 96px; height: 70px; border-radius: 3px; background: linear-gradient(180deg, #F2D6B0 0%, #B98A5E 100%); opacity: 0.8"></div>
      <div style="position: absolute; left: {{faceX}}px; top: 48px; width: 58px; height: 64px; border-radius: 29px / 32px; background: radial-gradient(70% 70% at 30% 40%, #F0C4A0 0%, #C68A62 35%, #4A2C1E 75%, #1E140E 100%)"></div>
      <div style="position: absolute; left: {{bodyX}}px; top: 104px; width: 118px; height: 110px; border-radius: 59px 59px 0 0; background: #140E0A"></div>
      <span style="position: absolute; right: 12px; bottom: 12px; font-family: Geist, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; color: #FF9A4D; text-shadow: 0 0 6px #FF8A3D99">10 NOV 2026</span>
      <div style="position: absolute; left: 10px; right: 10px; bottom: 6px; height: 2px; background: #FFFFFF26"><div class="sl-bar" style="height: 2px; background: #EDEDE8"></div></div>
    </div>
    <sc-if value="{{soundHint}}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; left: 0; right: 0; top: 160px; text-align: center; font-size: 13px; color: #B9B9B3">Sound on — the clip keeps its sound either way</span>
    </sc-if>

    <div style="position: absolute; left: 20px; right: 20px; top: 470px; display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid {{badgeLine}}; color: {{badgeColor}}; font-size: 12px; font-weight: 500"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="{{badgeIcon}}"></path></svg>{{badge}}</span>
      <span style="font-family: Geist, sans-serif; font-variant-numeric: tabular-nums; font-size: 12px; color: #B9B9B3">{{tc}}</span>
    </div>

    <div onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" role="slider" aria-label="Choose the part to keep" aria-valuetext="{{tc}}" tabindex="0" style="position: absolute; left: 0; top: 512px; width: 390px; height: 76px; overflow: hidden; touch-action: none; cursor: grab">
      <div style="position: absolute; left: 0; top: 10px; display: flex; gap: 2px; transform: translateX({{stripX}}px); transition: {{stripT}}">
        <sc-for list="{{frames}}" as="f" hint-placeholder-count="14">
          <div style="flex: 0 0 auto; width: 98px; height: 56px; border-radius: 4px; background: {{f}}"></div>
        </sc-for>
      </div>
      <div style="position: absolute; left: 0; top: 10px; width: 145px; height: 56px; background: #050505B3; pointer-events: none"></div>
      <div style="position: absolute; right: 0; top: 10px; width: 145px; height: 56px; background: #050505B3; pointer-events: none"></div>
      <div style="position: absolute; left: 143px; top: 4px; width: 104px; height: 68px; box-sizing: border-box; border: 2.5px solid {{frameColor}}; border-radius: 10px; box-shadow: 0 0 14px #FF8A3D99, 0 0 36px #FF8A3D55; pointer-events: none; transform: scale({{frameScale}}); transition: transform 160ms cubic-bezier(0.2,0,0,1)"></div>
    </div>
    <span style="position: absolute; left: 0; right: 0; top: 600px; text-align: center; font-size: 12px; color: #8E8E88">Drag to choose the part you keep</span>

    <a href="ProjectHubSaved.dc.html" style="position: absolute; left: 20px; right: 20px; top: 704px; height: 56px; border-radius: 28px; background: #FF8A3D; color: #0A0A0B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 17px; box-shadow: 0 8px 32px #FF8A3D44">Save clip</a>
  </sc-if>

  <!-- LOADING -->
  <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 20px; top: 196px; width: 350px; height: 197px; border-radius: 12px; overflow: hidden; background: #111113; border: 1px solid #1F1F22">
      <span class="sl-sweep" style="position: absolute; top: 0; width: 3px; height: 197px; background: #FFD2AE; box-shadow: 0 0 12px #FF8A3D, 0 0 32px #FF8A3D88"></span>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; top: 412px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 17px; font-weight: 500">Preparing video… {{pct}}%</span>
      <span style="font-family: Geist, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; color: #8E8E88">4:32 · 812 MB · 1080p</span>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; top: 470px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <span style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: {{s.color}}">
          <span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: {{s.ring}}; background: {{s.fill}}; display: flex; align-items: center; justify-content: center; color: #0A0A0B; font-size: 10px; font-weight: 700">{{s.mark}}</span>{{s.n}}
        </span>
      </sc-for>
    </div>
    <div style="position: absolute; left: 0; top: 582px; width: 390px; height: 56px; display: flex; gap: 2px; overflow: hidden">
      <sc-for list="{{skel}}" as="k" hint-placeholder-count="5">
        <div style="flex: 0 0 auto; width: 98px; height: 56px; border-radius: 4px; background: {{k}}; transition: background 300ms ease"></div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; top: 704px; height: 56px; border-radius: 28px; overflow: hidden; background: #202024">
      <div style="height: 56px; width: {{pct}}%; background: #2A2A2F; transition: width 100ms linear"></div>
      <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8E8E88; font-weight: 600; font-size: 17px">Preparing…</span>
    </div>
  </sc-if>

  <div style="position: absolute; left: 20px; right: 20px; top: 772px; display: flex; justify-content: space-between">
    <a href="CameraV2.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 8px; color: #B9B9B3; text-decoration: none; font-size: 15px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Retake</a>
    <a href="Looks.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 8px; color: #B9B9B3; text-decoration: none; font-size: 15px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Filters</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["ready","loading"],"default":"ready"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: (props && props.variant) || 'ready', pct: 0, pos: 4.2, mode: 'auto', drag: false, sound: false, hint: false };
  }
  componentDidMount() {
    this._iv = setInterval(() => {
      if (this.state.phase !== 'loading') return;
      const pct = this.state.pct + 1;
      if (pct >= 100) this.setState({ pct: 0 });
      else this.setState({ pct });
    }, 70);
  }
  componentWillUnmount() { clearInterval(this._iv); clearTimeout(this._ht); }
  renderVals() {
    const st = this.state;
    const len = 14.2, pps = 100;
    const pal = ['#2A2420', '#3A3028', '#5A4636', '#7A5E44', '#8A6A4C', '#7A5E44', '#5E4A3A', '#4A3C30', '#3A3028', '#4E4034', '#6A5440', '#5A4636', '#3A3028', '#2A2420', '#241E1A'];
    const frames = pal.map((c) => 'linear-gradient(160deg, ' + c + ', #0C0907)');
    const pos = Math.max(0, Math.min(len - 1, st.pos));
    const f2 = (s) => { const ss = Math.floor(s), cs = Math.round((s - ss) * 100) % 100; return '00:' + String(ss).padStart(2, '0') + '.' + String(cs).padStart(2, '0'); };
    const auto = st.mode === 'auto';
    const pct = st.pct;
    const stepState = (a, b) => pct >= b ? 'done' : (pct >= a ? 'now' : 'todo');
    const steps = [['Opening the file', 0, 15], ['Building the preview strip', 15, 75], ['Finding the best part', 75, 100]].map((x) => {
      const s = stepState(x[1], x[2]);
      return { n: x[0] + (s === 'now' && x[0].indexOf('strip') >= 0 ? ' · ' + Math.round((pct - 15) / 60 * 100) + '%' : ''), color: s === 'todo' ? '#55555A' : '#EDEDE8', ring: s === 'done' ? '0' : (s === 'now' ? '1.5px solid #FF8A3D' : '1.5px solid #3A3A40'), fill: s === 'done' ? '#8FC7A4' : 'transparent', mark: s === 'done' ? '✓' : '' };
    });
    const loaded = Math.floor(Math.max(0, pct - 15) / 60 * 5);
    const faceShift = 30 * Math.sin(pos * 0.6);
    return {
      ready: st.phase === 'ready', loading: st.phase === 'loading',
      pct: String(pct),
      steps,
      skel: [0, 1, 2, 3, 4].map((i) => i < loaded ? frames[i + 3] : '#141417'),
      toggleSound: () => { clearTimeout(this._ht); this.setState({ sound: !st.sound, hint: !st.sound }); this._ht = setTimeout(() => this.setState({ hint: false }), 2200); },
      soundOn: String(st.sound), soundLabel: st.sound ? 'Mute preview' : 'Play preview with sound',
      soundColor: st.sound ? '#EDEDE8' : '#8E8E88',
      soundPath: st.sound ? 'M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12' : 'M16 9l5 6M21 9l-5 6',
      soundHint: st.hint,
      faceX: (146 + faceShift).toFixed(0), bodyX: (116 + faceShift).toFixed(0),
      badge: auto ? 'Auto-picked' : 'Your pick', badgeColor: auto ? '#FF8A3D' : '#EDEDE8', badgeLine: auto ? '#FF8A3D55' : '#3A3A40',
      badgeIcon: auto ? 'M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z' : 'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z',
      tc: f2(pos) + ' – ' + f2(pos + 1),
      frames, stripX: (145 - pos * pps).toFixed(1), stripT: st.drag ? 'none' : 'transform 320ms cubic-bezier(0.3,0,0,1)',
      frameColor: st.drag ? '#FFD2AE' : '#FF8A3D', frameScale: st.drag ? 1.04 : 1,
      down: (e) => { const r = e.currentTarget.getBoundingClientRect(); this._sc = r.width / 390; this._sx = e.clientX; this._sp = pos; this._d = true; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} this.setState({ drag: true }); },
      move: (e) => { if (!this._d) return; this.setState({ pos: this._sp - (e.clientX - this._sx) / this._sc / pps, mode: 'custom' }); },
      up: () => { this._d = false; this.setState({ drag: false }); }
    };
  }
}
</script>
</body>
</html>
