<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0A0B; color: #EDEDE8; font-family: Geist, Inter, system-ui, sans-serif">

  <div style="position: absolute; left: 12px; right: 20px; top: 50px; height: 48px; display: flex; align-items: center; gap: 4px">
    <a href="ProjectHub.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: Geist, Inter, system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Settings</h1>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 104px; bottom: 0; overflow-y: auto; padding: 0 20px 40px; box-sizing: border-box; scrollbar-width: none; display: flex; flex-direction: column; gap: 22px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column">
        <span style="font-family: Geist, sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 500; color: #8E8E88; padding-bottom: 6px">{{g.n}}</span>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <sc-if value="{{r.isLink}}" hint-placeholder-val="{{ true }}">
            <a href="{{r.href}}" style="min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #1F1F22; color: #EDEDE8; text-decoration: none">
              <span style="display: flex; flex-direction: column; gap: 3px; padding: 8px 0"><span style="font-size: 15px">{{r.n}}</span><span style="font-size: 12px; color: #8E8E88; display: {{r.dShow}}">{{r.d}}</span></span>
              <span style="display: flex; align-items: center; gap: 8px; font-family: Geist, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; color: {{r.vColor}}; white-space: nowrap">{{r.v}}<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55555A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></span>
            </a>
          </sc-if>
          <sc-if value="{{r.isSwitch}}" hint-placeholder-val="{{ false }}">
            <button onClick="{{r.toggle}}" role="switch" aria-checked="{{r.on}}" style="min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-top: 1px solid #1F1F22; background: transparent; color: #EDEDE8; padding: 0; font-family: Geist, sans-serif; text-align: left">
              <span style="display: flex; flex-direction: column; gap: 3px; padding: 8px 0"><span style="font-size: 15px">{{r.n}}</span><span style="font-size: 12px; line-height: 1.35; color: #8E8E88">{{r.d}}</span></span>
              <span style="flex: 0 0 44px; position: relative; height: 26px; border-radius: 13px; background: {{r.track}}"><span style="position: absolute; top: 2px; left: {{r.knob}}px; width: 22px; height: 22px; border-radius: 11px; background: #EDEDE8; box-sizing: border-box; border: 2px solid #0A0A0B"></span></span>
            </button>
          </sc-if>
          <sc-if value="{{r.isSeg}}" hint-placeholder-val="{{ false }}">
            <div style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #1F1F22">
              <span style="font-size: 15px">{{r.n}}</span>
              <span style="display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: #111113; border: 1px solid #26262A">
                <sc-for list="{{r.opts}}" as="o" hint-placeholder-count="2">
                  <button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 30px; padding: 0 12px; border-radius: 15px; border: 0; background: {{o.bg}}; color: {{o.color}}; font-family: Geist, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; ">{{o.n}}</button>
                </sc-for>
              </span>
            </div>
          </sc-if>
        </sc-for>
      </div>
    </sc-for>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 10px">
      <div style="display: flex; align-items: center; gap: 0.32em; font-family: Geist, sans-serif; font-weight: 300; font-size: 20px; color: #B9B9B3"><span>S</span><span>L</span><span style="width: 1.5px; height: 24px; background: #EDEDE8"></span><span>V</span><span>E</span><span>R</span></div>
      <span style="font-family: Geist, sans-serif; font-variant-numeric: tabular-nums; font-size: 10px; color: #55555A">VERSION 1.0 (1) · FREE, NO ADS, NO TRACKING</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { date: true, fullRec: false, fmt: 'cinema' }; }
  renderVals() {
    const st = this.state;
    const link = (n, href, v, d, vColor) => ({ isLink: true, isSwitch: false, isSeg: false, n, href, v: v || '', d: d || '', dShow: d ? 'block' : 'none', vColor: vColor || '#8E8E88' });
    const sw = (n, d, on, toggle) => ({ isLink: false, isSwitch: true, isSeg: false, n, d, on: String(on), toggle, track: on ? '#EDEDE8' : '#3A3A40', knob: on ? 20 : 2 });
    const seg = (n, opts) => ({ isLink: false, isSwitch: false, isSeg: true, n, opts });
    return {
      groups: [
        { n: 'Account & backup', rows: [
          link('Account', 'AccountSettings.dc.html', 'Google'),
          link('Backup', 'Backup.dc.html', 'Up to date', '', '#8FC7A4')
        ]},
        { n: 'Capture', rows: [
          link('Appearance', 'Settings.dc.html', 'System'),
          link('Default filter', 'Looks.dc.html', 'Natural'),
          link('Default film format', 'Settings.dc.html', 'Cinema 16:9'),
          sw('Date stamp', 'On every clip. You can still turn it off for a film before rendering.', st.date, () => this.setState({ date: !st.date })),
          sw('Also save full recordings to Photos', 'Off: only the chosen clip is kept, the rest is deleted.', st.fullRec, () => this.setState({ fullRec: !st.fullRec }))
        ]},
        { n: 'Reminders & past', rows: [
          link('Daily reminder', 'Reminders.dc.html', '20:00, every day'),
          link('Fill the past from gallery', 'Backfill.dc.html', '', 'Match photos & videos to empty days')
        ]},
        { n: 'About', rows: [
          link('What SLIVER stores', 'AccountSettings.dc.html', '', 'Your videos never leave your phone & Drive'),
          link('Send feedback', 'Settings.dc.html', 'Email')
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
