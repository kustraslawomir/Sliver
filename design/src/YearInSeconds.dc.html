  </div>

  <div style="position: absolute; left: 0; right: 0; top: 128px; display: flex; flex-direction: column; align-items: center; gap: 14px">

      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-top: 1px solid #26262A">
        <span style="font-size: 15px; color: #B9B9B3">{{s.k}}</span>
        <span style="font-family: Geist, Inter, system-ui, sans-serif; font-size: 22px; line-height: 1; font-weight: 600; letter-spacing: -0.02em">{{s.v}}</span>
