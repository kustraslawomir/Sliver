<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check a day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #050505; color: #EDEDE8; font-family: Geist, Inter, system-ui, sans-serif">

  <!-- header: what this is + where you are when walking one by one -->
  <div style="position: absolute; left: 12px; right: 12px; top: 50px; height: 48px; display: flex; align-items: center; justify-content: space-between">
    <a href="ProjectHub.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 3px">
      <span style="font-size: 17px; font-weight: 600">{{title}}</span>
      <span style="font-size: 13px; color: #8E8E88">Tuesday 3 November</span>
    </span>
    <span style="display: flex; visibility: {{navVis}}">
      <button aria-label="Previous day to check" style="width: 40px; height: 44px; border: 0; background: transparent; color: #55555A; padding: 0; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <button aria-label="Next day to check" style="width: 40px; height: 44px; border: 0; background: transparent; color: #EDEDE8; padding: 0; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></button>
    </span>
  </div>

  <!-- preview: the 1 s that will be kept -->
  <div style="position: absolute; left: 20px; top: 116px; width: 350px; height: 197px; border-radius: 12px; overflow: hidden; background: {{bg}}">
    <div style="position: absolute; left: 58%; top: 26%; width: 18%; padding-top: 18%; border-radius: 50%; background: #0A0806D9"></div>
    <div style="position: absolute; left: 52%; top: 52%; width: 30%; height: 60%; border-radius: 999px 999px 0 0; background: #0A0806D9"></div>
    <button aria-label="Sound on" style="position: absolute; right: 8px; bottom: 8px; width: 36px; height: 36px; border-radius: 18px; border: 0; background: #0000008C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg></button>
  </div>

  <!-- filmstrip with the fixed 1 s window -->
  <div style="position: absolute; left: 0; right: 0; top: 336px; height: 56px">
    <div style="position: absolute; left: -30px; top: 6px; display: flex; gap: 2px">
      <sc-for list="{{strip}}" as="s" hint-placeholder-count="14"><span style="width: 32px; height: 44px; border-radius: 3px; background: {{s.bg}}; opacity: 0.55"></span></sc-for>
    </div>
    <div style="position: absolute; left: 161px; top: 0; width: 68px; height: 56px; box-sizing: border-box; border-radius: 8px; border: 2.5px solid #EDEDE8"></div>
  </div>
  <span style="position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; color: #8E8E88">Drag the strip · 0:07.2 of 0:14</span>

  <!-- other items from this day: tap = swap in place -->
  <div style="position: absolute; left: 20px; right: 0; top: 446px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 500; color: #B9B9B3">Other items from this day</span>
    <div style="display: flex; gap: 8px; overflow-x: auto; padding-right: 20px; scrollbar-width: none">
      <sc-for list="{{others}}" as="o" hint-placeholder-count="6">
        <button aria-label="{{o.aria}}" aria-pressed="{{o.on}}" style="position: relative; flex: 0 0 72px; height: 72px; box-sizing: border-box; border-radius: 10px; border: {{o.ring}}; background: {{o.bg}}; padding: 0">
          <span style="position: absolute; right: 5px; bottom: 4px; font-size: 10px; font-variant-numeric: tabular-nums; color: #FFFFFF; text-shadow: 0 1px 4px #000000">{{o.dur}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <!-- actions -->
  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 6px">
    <a href="ProjectHub.dc.html" style="height: 56px; border-radius: 28px; background: #EDEDE8; color: #0A0A0B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 17px">Keep this clip</a>
    <a href="ProjectHub.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; color: #E5675F; text-decoration: none; font-size: 15px">Remove day</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["auto","draft"],"default":"auto"},"walking":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const draft = this.props.kind === 'draft', walking = this.props.walking !== false;
    const pal = ['#4E5A63', '#7A6A50', '#A07050', '#506A7A', '#6A5A7A', '#5A6A50', '#8A6A48', '#6A4A5A', '#3E5A6A', '#9A7A5A'];
    const strip = []; for (let i = 0; i < 14; i++) strip.push({ bg: 'linear-gradient(160deg, ' + pal[(i + 2) % pal.length] + ', #0C0B0A)' });
    const others = [['Video 0:14', '0:14', 1], ['Photo', '', 4], ['Motion photo', '', 6], ['Video 0:42', '0:42', 3], ['Photo', '', 8], ['Photo', '', 0]];
    return {
      title: (draft ? 'Draft' : 'Auto-filled') + (walking ? ' · 1 of 3' : ''),
      navVis: walking ? 'visible' : 'hidden',
      bg: 'linear-gradient(160deg, #8A6A48, #0C0B0A)',
      strip,
      others: others.map((o, i) => ({ aria: o[0] + (i === 0 ? ', in use' : ''), dur: o[1], on: String(i === 0), ring: i === 0 ? '2px solid #EDEDE8' : '0', bg: 'linear-gradient(160deg, ' + pal[o[2]] + ', #0C0B0A)' }))
    };
  }
}
</script>
</body>
</html>
