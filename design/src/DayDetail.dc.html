<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #050505; color: #EDEDE8; font-family: Geist, Inter, system-ui, sans-serif">
  <!-- full-bleed 1 s loop -->
  <div style="position: absolute; inset: 0; background: {{bg}}">
    <div style="position: absolute; left: 40%; top: 30%; width: 34%; padding-top: 34%; border-radius: 50%; background: #0A0806CC"></div>
    <div style="position: absolute; left: 30%; top: 50%; width: 54%; height: 60%; border-radius: 999px 999px 0 0; background: #0A0806CC"></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(180deg, #000000B3, #00000000)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(180deg, #00000000, #000000D9 60%)"></div>

  <div style="position: absolute; left: 12px; right: 12px; top: 50px; height: 48px; display: flex; align-items: center; justify-content: space-between">
    <a href="ProjectHub.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #0000008C; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <button onClick="{{toggleSound}}" aria-label="{{soundLabel}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #0000008C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="{{soundPath}}"></path></svg></button>
  </div>

  <!-- day + prev/next -->
  <div style="position: absolute; left: 8px; right: 8px; bottom: 132px; display: flex; align-items: center; justify-content: space-between">
    <button onClick="{{prev}}" aria-label="Previous day" style="width: 48px; height: 48px; border: 0; background: transparent; color: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-size: 24px; line-height: 1; font-weight: 600; letter-spacing: -0.02em">{{dayName}}</span>
      <span style="font-size: 13px; color: #B9B9B3">{{sub}}</span>
    </span>
    <button onClick="{{next}}" aria-label="Next day" style="width: 48px; height: 48px; border: 0; background: transparent; color: #FFFFFF; padding: 0; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></button>
  </div>

  <!-- the two actions. Remove acts at once, Undo bar above the buttons. -->
  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; gap: 10px">
    <a href="FromThisDay.dc.html" style="flex: 1 1 0; height: 52px; border-radius: 26px; background: #EDEDE8; color: #0A0A0B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 16px">Replace</a>
    <button onClick="{{remove}}" style="flex: 1 1 0; height: 52px; box-sizing: border-box; border-radius: 26px; border: 1px solid #FFFFFF40; background: #0000008C; color: #E5675F; font-family: Geist, sans-serif; font-size: 16px">Remove</button>
  </div>
  <sc-if value="{{removed}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 196px; height: 48px; box-sizing: border-box; border-radius: 14px; background: #EDEDE8; color: #0A0A0B; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 16px; font-size: 14px"><span>Clip removed</span><button onClick="{{undo}}" style="height: 36px; padding: 0 12px; border: 0; background: transparent; font-family: Geist, sans-serif; font-size: 14px; font-weight: 600; color: #0A0A0B">Undo</button></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"removed":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, sound: true, removed: !!(props && props.removed) }; }
  renderVals() {
    const st = this.state;
    const D = [['Tuesday 10 November', 'Today · 18:42', '#8A6A48'], ['Monday 9 November', '07:15', '#506A7A'], ['Sunday 8 November', '13:02', '#5A6A50']];
    const d = D[st.i];
    return {
      bg: 'radial-gradient(80% 60% at 60% 30%, ' + d[2] + ' 0%, #1A140F 70%, #050505 100%)',
      dayName: d[0], sub: d[1],
      prev: () => this.setState({ i: Math.min(2, st.i + 1) }), next: () => this.setState({ i: Math.max(0, st.i - 1) }),
      toggleSound: () => this.setState({ sound: !st.sound }), soundLabel: st.sound ? 'Mute' : 'Sound on',
      soundPath: st.sound ? 'M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13' : 'M16 9l5 6M21 9l-5 6',
      removed: st.removed, remove: () => this.setState({ removed: true }), undo: () => this.setState({ removed: false })
    };
  }
}
</script>
</body>
</html>
