<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film builder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #050505; color: #EDEDE8; font-family: Geist, Inter, system-ui, sans-serif">

  <!-- header -->
  <div style="position: absolute; left: 12px; right: 12px; top: 50px; height: 48px; display: flex; align-items: center; justify-content: space-between">
    <a href="ProjectHub.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-family: Geist, Inter, system-ui, sans-serif; font-size: 18px; line-height: 1; font-weight: 600; letter-spacing: -0.02em">My 2026</span>
      <span style="font-size: 12px; color: #8E8E88">{{fmtLabel}}</span>
    </div>
    <span style="width: 44px"></span>
  </div>

  <!-- preview -->
  <button onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="position: absolute; left: {{pvX}}px; top: 106px; width: {{pvW}}px; height: {{pvH}}px; padding: 0; border: 1px solid #26262A; border-radius: 12px; overflow: hidden; background: #000000; cursor: pointer">
    <div style="position: absolute; inset: 0; filter: {{lookFilter}}; background: {{dayBg}}">
      <div style="position: absolute; left: {{subX}}%; top: 30%; width: 16%; padding-top: 16%; border-radius: 50%; background: #0A0806E6"></div>
      <div style="position: absolute; left: {{subBX}}%; top: 52%; width: 28%; height: 60%; border-radius: 999px 999px 0 0; background: #0A0806E6"></div>
    </div>
    <div style="position: absolute; inset: 0; background: #000000; opacity: {{fadeO}}"></div>
    <sc-if value="{{dateOn}}" hint-placeholder-val="{{ true }}">
      <span style="position: absolute; left: 12px; bottom: 10px; font-size: 12px; font-variant-numeric: tabular-nums; color: #EDEDE8; text-shadow: 0 1px 6px #000000">{{dayLabel}}</span>
    </sc-if>
    <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 26px; background: #050505B3; display: flex; align-items: center; justify-content: center"><span style="width: 0; height: 0; margin-left: 4px; border-left: 14px solid #EDEDE8; border-top: 9px solid transparent; border-bottom: 9px solid transparent"></span></span>
    </sc-if>
  </button>

  <!-- scrubber -->
  <div style="position: absolute; left: 20px; right: 20px; top: 338px; display: flex; flex-direction: column; gap: 8px">
    <div onClick="{{seek}}" role="slider" aria-label="Scrub film" aria-valuetext="{{timeLabel}}" tabindex="0" style="position: relative; height: 24px; cursor: pointer">
      <div style="position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: #26262A"></div>
      <sc-for list="{{ticks}}" as="tk" hint-placeholder-count="12">
        <span style="position: absolute; left: {{tk.x}}%; top: {{tk.top}}px; width: 1px; height: {{tk.h}}px; background: #55555A"></span>
      </sc-for>
      <div style="position: absolute; left: 0; top: 11px; height: 2px; width: {{headPct}}%; background: #EDEDE8"></div>
      <span style="position: absolute; left: {{headPct}}%; top: 2px; width: 3px; height: 20px; margin-left: -1px; border-radius: 2px; background: #FFFFFF; box-shadow: none"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-variant-numeric: tabular-nums; color: #8E8E88">
      <span>{{timeLabel}}</span><span>{{count}} clips · {{rangeText}}</span>
    </div>
  </div>

  <!-- options -->
  <div style="position: absolute; left: 0; right: 0; top: 400px; height: 300px; overflow-y: auto; padding: 0 20px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; scrollbar-width: none">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 500; color: #8E8E88">Sound</span>
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #111113; border: 1px solid #26262A">
        <sc-for list="{{audios}}" as="a" hint-placeholder-count="3">
          <button onClick="{{a.pick}}" aria-pressed="{{a.on}}" style="flex: 1 1 0; height: 34px; border-radius: 17px; border: 0; background: {{a.bg}}; color: {{a.color}}; font-family: Geist, sans-serif; font-size: 14px">{{a.n}}</button>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #8E8E88">{{audioHint}}</span>
      <sc-if value="{{hasMusic}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{tracks}}" as="tr" hint-placeholder-count="2">
            <button onClick="{{tr.pick}}" aria-pressed="{{tr.on}}" style="height: 44px; display: flex; align-items: center; gap: 12px; border: 0; border-top: 1px solid #1F1F22; background: transparent; color: #EDEDE8; font-family: Geist, sans-serif; font-size: 15px; padding: 0">
              <span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: {{tr.ring}}; background: {{tr.dot}}"></span>
              <span style="flex-grow: 1; text-align: left">{{tr.n}}</span>
              <span style="font-size: 12px; font-variant-numeric: tabular-nums; color: #8E8E88">{{tr.meta}}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <button onClick="{{toggleDate}}" role="switch" aria-checked="{{dateStr}}" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-top: 1px solid #1F1F22; border-bottom: 1px solid #1F1F22; background: transparent; color: #EDEDE8; padding: 0; font-family: Geist, sans-serif; font-size: 15px; text-align: left">
      Date on screen
      <span style="flex: 0 0 44px; position: relative; height: 26px; border-radius: 13px; background: {{dTrack}}"><span style="position: absolute; top: 2px; left: {{dKnob}}px; width: 22px; height: 22px; border-radius: 11px; background: #EDEDE8; box-sizing: border-box; border: 2px solid #0A0A0B"></span></span>
    </button>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 500; color: #8E8E88">Filter · whole film</span>
      <div style="display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px; padding: 0 20px; scrollbar-width: none">
        <sc-for list="{{looks}}" as="l" hint-placeholder-count="7">
          <button onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; padding: 0; color: {{l.color}}; font-family: Geist, sans-serif; font-size: 12px">
            <span style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 12px; border: {{l.border}}; padding: 2px"><span style="display: block; width: 100%; height: 100%; border-radius: 9px; background: {{thumbBg}}; filter: {{l.f}}"></span></span>{{l.n}}
          </button>
        </sc-for>
      </div>
      <sc-if value="{{hasLook}}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{sliders}}" as="s" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 14px; height: 40px">
            <span style="flex: 0 0 72px; font-size: 14px; color: #B9B9B3">{{s.n}}</span>
            <span style="position: relative; flex: 1 1 auto; height: 24px"><span style="position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: #26262A"></span><span style="position: absolute; left: 0; top: 11px; height: 2px; width: {{s.v}}%; background: #EDEDE8"></span><span style="position: absolute; left: {{s.v}}%; top: 2px; width: 20px; height: 20px; margin-left: -10px; border-radius: 10px; background: #EDEDE8"></span></span>
            <span style="flex: 0 0 30px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: #8E8E88">{{s.v}}</span>
          </div>
        </sc-for>
      </sc-if>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 680px; height: 24px; background: linear-gradient(180deg, transparent, #050505); pointer-events: none"></div>
  <a href="Export.dc.html" style="position: absolute; left: 20px; right: 20px; top: 716px; height: 56px; border-radius: 28px; background: #EDEDE8; color: #0A0A0B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 17px; box-shadow: none">Make film · {{totalLabel}}</a>
  <span style="position: absolute; left: 20px; right: 20px; top: 786px; text-align: center; font-size: 12px; color: #8E8E88">Rendered on your phone, 1080p. Works offline.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"format":{"editor":"enum","options":["cinema","story"],"default":"cinema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { audio: 'original', track: 0, cut: 'cut', date: true, look: 0, playing: true, t: 0 };
  }
  componentDidMount() { this._iv = setInterval(() => { if (this.state.playing) this.setState({ t: this.state.t + 100 }); }, 100); }
  componentWillUnmount() { clearInterval(this._iv); }
  renderVals() {
    const st = this.state;
    const ML = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const MS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const doy = (m, d) => { let n = d; for (let i = 0; i < m; i++) n += ML[i]; return n; };
    const md = (n) => { let m = 0, d = n; while (d > ML[m]) { d -= ML[m]; m++; } return [m, d]; };
    const START = doy(5, 21), TODAY = doy(10, 10);
    const filled = (n) => { if (n < START || n >= TODAY) return false; const x = md(n); if (x[0] === 10) return [3, 6, 9].indexOf(x[1]) < 0; return n % 13 !== 0; };
    const R = { week: [doy(10, 4), TODAY], month: [doy(10, 1), TODAY], year: [START, TODAY], custom: [doy(8, 1), doy(8, 30) + 1] };
    const rt = { week: '4—10 NOV', month: 'NOVEMBER', year: '21 JUN — 10 NOV', custom: '1—30 SEP' };
    const span = R.year;
    const days = [];
    for (let n = span[0]; n < span[1]; n++) if (filled(n)) days.push(n);
    const count = Math.max(1, days.length);
    const total = count * 1000;
    const t = st.t % total;
    const idx = Math.floor(t / 1000);
    const p = (t % 1000) / 1000;
    const n = days[idx] || START;
    const x = md(n);
    const pal = ['#4E5A63', '#7A6A50', '#A07050', '#506A7A', '#6A5A7A', '#5A6A50', '#8A6A48', '#6A4A5A', '#3E5A6A', '#9A7A5A'];
    const story = this.props.format === 'story';
    const pvW = story ? 124 : 350, pvH = story ? 220 : 197;
    const fmt = (ms) => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
    const ticks = [];
    if (count <= 40) { for (let i = 1; i < count; i++) ticks.push({ x: (i / count * 100).toFixed(2), top: 7, h: 10 }); }
    else { for (let i = 1; i < count; i++) { if (md(days[i])[1] < md(days[i - 1])[1]) ticks.push({ x: (i / count * 100).toFixed(2), top: 3, h: 18 }); } }
    const LN = ['None', 'Kiosk', 'Afterhours', 'Silver', 'Sunday', 'Tape', 'Halo'];
    const LF = ['none', 'saturate(1.25) contrast(1.08) sepia(0.12)', 'saturate(1.5) contrast(1.2) brightness(0.85) hue-rotate(-10deg)', 'grayscale(1) contrast(1.2)', 'sepia(0.35) saturate(1.2) brightness(1.08)', 'saturate(0.8) contrast(0.9) brightness(1.05) sepia(0.2)', 'brightness(1.15) contrast(0.85) saturate(0.9)'];
    const seg = (on) => ({ bg: on ? '#EDEDE8' : 'transparent', color: on ? '#0A0A0B' : '#B9B9B3', on: String(on) });
    const TR = [['coastline.mp3', '2:55'], ['Pick another audio file…', 'MP3 · M4A']];
    const AH = { original: 'Every clip keeps its own sound.', music: 'Music only — original sound muted.', mix: 'Music sits quietly under the original sound.' };
    let fadeO = 0;
    if (st.cut === 'fade') fadeO = p < 0.12 ? 1 - p / 0.12 : (p > 0.88 ? (p - 0.88) / 0.12 : 0);
    const sub = 30 + 30 * Math.sin(n * 1.7);
    return {
      fmtLabel: story ? 'Story 9:16' : 'Cinema 16:9',
      pvW, pvH, pvX: ((390 - pvW) / 2).toFixed(0),
      togglePlay: () => this.setState({ playing: !st.playing }),
      playLabel: st.playing ? 'Pause preview' : 'Play preview', paused: !st.playing,
      lookFilter: LF[st.look],
      dayBg: 'linear-gradient(160deg, ' + pal[n % pal.length] + ' 0%, #0C0B0A 100%)',
      subX: sub.toFixed(0), subBX: (sub - 6).toFixed(0),
      fadeO: fadeO.toFixed(2),
      dateOn: st.date, toggleDate: () => this.setState({ date: !st.date }), dateStr: String(st.date), dTrack: st.date ? '#EDEDE8' : '#3A3A40', dKnob: st.date ? 20 : 2, hasLook: st.look > 0, thumbBg: 'linear-gradient(160deg, #A07050, #0C0B0A)', sliders: [{ n: 'Intensity', v: 70 }, { n: 'Grain', v: 30 }],
      dayLabel: x[1] + ' ' + MS[x[0]] + ' 2026',
      ticks, headPct: (t / total * 100).toFixed(2),
      seek: (e) => { const r = e.currentTarget.getBoundingClientRect(); const f = Math.max(0, Math.min(0.999, (e.clientX - r.left) / r.width)); this.setState({ t: Math.floor(f * count) * 1000 }); },
      timeLabel: fmt(t) + ' / ' + fmt(total),
      totalLabel: fmt(total), count: days.length, rangeText: '21 Jun – 10 Nov',
      audios: [['original', 'Original'], ['music', 'Music'], ['mix', 'Mix']].map((a) => Object.assign({ n: a[1], pick: () => this.setState({ audio: a[0] }) }, seg(st.audio === a[0]))),
      audioHint: AH[st.audio], hasMusic: st.audio !== 'original',
      tracks: TR.map((tr, i) => ({ n: tr[0], meta: tr[1], on: String(i === st.track), pick: () => this.setState({ track: i }), ring: i === st.track ? '5px solid #EDEDE8' : '1.5px solid #55555A', dot: 'transparent' })),
      looks: LN.map((l, i) => ({ n: l, f: LF[i], on: String(i === st.look), pick: () => this.setState({ look: i }), border: i === st.look ? '2px solid #EDEDE8' : '2px solid transparent', color: i === st.look ? '#EDEDE8' : '#8E8E88' }))
    };
  }
}
</script>
</body>
</html>
