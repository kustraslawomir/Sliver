<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>From this day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0A0B; color: #EDEDE8; font-family: Geist, Inter, system-ui, sans-serif">

  <div style="position: absolute; left: 12px; right: 20px; top: 50px; height: 48px; display: flex; align-items: center; gap: 4px">
    <a href="ProjectHub.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; line-height: 1; font-weight: 600; letter-spacing: -0.02em">Tuesday 3 November</span></span>
  </div>
  <span style="position: absolute; left: 20px; top: 104px; font-size: 14px; color: #8E8E88">{{countText}}</span>

  <div style="position: absolute; left: 0; right: 0; top: 136px; bottom: 150px; overflow-y: auto; padding: 0 20px; box-sizing: border-box; scrollbar-width: none">
    <sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
          <a href="{{it.href}}" aria-label="{{it.aria}}" style="position: relative; aspect-ratio: 1 / 1; border-radius: 8px; background: {{it.bg}}; overflow: hidden; text-decoration: none">
            <sc-if value="{{it.isVideo}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 6px; bottom: 5px; font-size: 11px; font-variant-numeric: tabular-nums; color: #FFFFFF; text-shadow: 0 1px 4px #000000">{{it.dur}}</span></sc-if>
            <sc-if value="{{it.isLive}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 6px; top: 6px; width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="width: 5px; height: 5px; border-radius: 3px; background: #FFFFFF"></span></span></sc-if>
            <span style="position: absolute; left: 6px; bottom: 5px; font-size: 11px; font-variant-numeric: tabular-nums; color: #FFFFFFCC; text-shadow: 0 1px 4px #000000">{{it.time}}</span>
          </a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding-top: 120px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <span style="font-size: 18px; font-weight: 600">Nothing from this day</span>
        <span style="font-size: 14px; line-height: 1.4; color: #8E8E88; max-width: 260px">Your camera roll has no photos or videos from 3 November.</span>
      </div>
    </sc-if>
  </div>

  <!-- bottom: switch + browse all -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; box-sizing: border-box; border-top: 1px solid #1F1F22; background: #0A0A0B; padding: 6px 20px 34px; display: flex; flex-direction: column; gap: 8px">
    <button onClick="{{toggleAll}}" role="switch" aria-checked="{{allStr}}" style="height: 52px; display: flex; align-items: center; justify-content: space-between; border: 0; background: transparent; color: #EDEDE8; padding: 0; font-family: Geist, sans-serif; font-size: 15px; text-align: left">
      <span style="display: flex; flex-direction: column; gap: 2px"><span>Show saved and received too</span><span style="font-size: 12px; color: #8E8E88">WhatsApp, downloads, other apps. Screenshots never.</span></span>
      <span style="flex: 0 0 44px; position: relative; height: 26px; border-radius: 13px; background: {{track}}"><span style="position: absolute; top: 2px; left: {{knob}}px; width: 22px; height: 22px; border-radius: 11px; background: #EDEDE8; box-sizing: border-box; border: 2px solid #0A0A0B"></span></span>
    </button>
    <a href="PickerV2.dc.html" style="height: 48px; box-sizing: border-box; border-radius: 24px; border: 1px solid #3A3A40; display: flex; align-items: center; justify-content: center; gap: 8px; color: #EDEDE8; text-decoration: none; font-size: 15px; white-space: nowrap"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg>Browse all photos</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"empty":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { all: false }; }
  renderVals() {
    const st = this.state, empty = !!this.props.empty;
    const pal = ['#4E5A63', '#7A6A50', '#A07050', '#506A7A', '#6A5A7A', '#5A6A50', '#8A6A48', '#6A4A5A', '#3E5A6A', '#9A7A5A'];
    // camera items first (by time), then saved/received when the switch is on
    const cam = [['08:12', 'video', '0:14'], ['08:13', 'photo'], ['12:40', 'live'], ['12:41', 'photo'], ['17:05', 'video', '0:42'], ['17:06', 'photo'], ['19:30', 'photo']];
    const other = [['10:02', 'photo'], ['21:15', 'video', '0:09']];
    const list = empty ? [] : cam.concat(st.all ? other : []);
    return {
      countText: empty ? 'From your camera roll' : list.length + (st.all ? ' items · camera first' : ' from your camera'),
      hasItems: !empty, empty,
      items: list.map((q, i) => ({ time: q[0], isVideo: q[1] === 'video', isLive: q[1] === 'live', dur: q[2] || '', bg: 'linear-gradient(160deg, ' + pal[(i * 3 + 1) % pal.length] + ', #0C0B0A)', href: q[1] === 'photo' ? 'PhotoTrim.dc.html' : 'EditClipV2.dc.html', aria: (q[1] === 'video' ? 'Video ' + q[2] : q[1] === 'live' ? 'Motion photo' : 'Photo') + ', ' + q[0] })),
      toggleAll: () => this.setState({ all: !st.all }), allStr: String(st.all), track: st.all ? '#EDEDE8' : '#3A3A40', knob: st.all ? 20 : 2
    };
  }
}
</script>
</body>
</html>
