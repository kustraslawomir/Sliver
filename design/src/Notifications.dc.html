<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notification settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A0A0B; color: #EDEDE8; font-family: Geist, Inter, system-ui, sans-serif">

  <div style="position: absolute; left: 12px; right: 20px; top: 50px; height: 48px; display: flex; align-items: center; gap: 4px">
    <a href="ProjectHub.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: Geist, Inter, system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 1; letter-spacing: -0.02em">Notifications</h1>
  </div>

  <sc-if value="{{denied}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 20px; right: 20px; top: 110px; box-sizing: border-box; border-radius: 20px; border: 1px solid #E8C27A55; background: #1A1710; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 500">Notifications are off for SLIVER</span>
      <span style="font-size: 13px; line-height: 1.45; color: #B9B9B3">No problem — the app works the same. If you'd like a daily nudge, turn them on in your phone's Settings.</span>
      <button style="align-self: flex-start; height: 38px; padding: 0 16px; border-radius: 19px; border: 0; background: #EDEDE8; color: #0A0A0B; font-family: Geist, sans-serif; font-weight: 600; font-size: 14px">Open Settings</button>
    </div>
  </sc-if>

  <div style="position: absolute; left: 20px; right: 20px; top: {{top}}px; display: flex; flex-direction: column; gap: 12px; opacity: {{dim}}; pointer-events: {{pe}}">
    <span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #8E8E88">DAILY REMINDER</span>
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #111113; border: 1px solid #26262A">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="flex: 1 1 0; height: 34px; border-radius: 17px; border: 0; background: {{m.bg}}; color: {{m.color}}; font-family: Geist, sans-serif; font-size: 14px">{{m.n}}</button>
      </sc-for>
    </div>
    <sc-if value="{{hasChoices}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 6px">
        <sc-for list="{{choices}}" as="c" hint-placeholder-count="4">
          <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="flex: 1 1 0; height: 44px; border-radius: 14px; border: {{c.border}}; background: {{c.bg}}; color: #EDEDE8; font-family: 'Geist Mono', monospace; font-size: 12px">{{c.n}}</button>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button onClick="{{d.toggle}}" aria-pressed="{{d.on}}" aria-label="{{d.label}}" style="width: 44px; height: 44px; border-radius: 22px; border: {{d.border}}; background: {{d.bg}}; color: {{d.color}}; font-family: 'Geist Mono', monospace; font-size: 12px">{{d.n}}</button>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #8E8E88">{{hint}}</span>
    </sc-if>

    <span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #8E8E88; padding-top: 10px">ALSO TELL ME</span>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
        <button onClick="{{t.toggle}}" role="switch" aria-checked="{{t.on}}" style="height: 58px; display: flex; align-items: center; justify-content: space-between; border: 0; border-top: 1px solid #1F1F22; background: transparent; color: #EDEDE8; padding: 0; font-family: Geist, sans-serif; text-align: left">
          <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px">{{t.n}}</span><span style="font-size: 12px; color: #8E8E88">{{t.d}}</span></span>
          <span style="flex: 0 0 44px; position: relative; height: 26px; border-radius: 13px; background: {{t.track}}"><span style="position: absolute; top: 2px; left: {{t.knob}}px; width: 22px; height: 22px; border-radius: 11px; background: #EDEDE8; box-sizing: border-box; border: 2px solid #0A0A0B"></span></span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"denied":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'fixed', time: 2, win: 1, days: [true, true, true, true, true, true, true], types: [false, true, true, true] }; }
  renderVals() {
    const st = this.state;
    const denied = !!this.props.denied;
    const seg = (on) => ({ bg: on ? '#EDEDE8' : 'transparent', color: on ? '#0A0A0B' : '#B9B9B3', on: String(on) });
    const pill = (on) => ({ border: on ? '1.5px solid #EDEDE8' : '1px solid #26262A', bg: on ? '#EDEDE81F' : '#111113', on: String(on) });
    const sw = (on) => ({ track: on ? '#EDEDE8' : '#3A3A40', knob: on ? 20 : 2, on: String(on) });
    const fixed = st.mode === 'fixed';
    const opts = fixed ? ['09:00', '13:00', '19:30', '21:30'] : ['8—12', '10—20', '17—22'];
    const sel = fixed ? st.time : st.win;
    const D = ['M', 'T', 'W', 'T', 'F', 'S', 'S'], DL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const T = [
      ['Running late', 'At 21:00 if today has no clip yet'],
      ['Film ready', 'When a film finishes rendering'],
      ['Backup problems', 'Only when something needs you'],
      ['On this day', 'A past clip, once a week at most']
    ];
    return {
      denied, top: denied ? 270 : 116, dim: denied ? 0.4 : 1, pe: denied ? 'none' : 'auto',
      modes: [['fixed', 'Fixed time'], ['random', 'Random'], ['off', 'Off']].map((m) => Object.assign({ n: m[1], pick: () => this.setState({ mode: m[0] }) }, seg(st.mode === m[0]))),
      hasChoices: st.mode !== 'off',
      choices: opts.map((n, i) => Object.assign({ n, pick: () => this.setState(fixed ? { time: i } : { win: i }) }, pill(i === sel))),
      days: D.map((n, i) => ({ n, label: DL[i], on: String(st.days[i]), toggle: () => { const d = st.days.slice(); d[i] = !d[i]; this.setState({ days: d }); }, border: st.days[i] ? '1px solid #EDEDE8' : '1px solid #26262A', bg: st.days[i] ? '#EDEDE8' : 'transparent', color: st.days[i] ? '#0A0A0B' : '#8E8E88' })),
      hint: fixed ? 'Every chosen day at ' + opts[st.time] + '.' : 'Once a day, at a random moment between ' + opts[st.win].replace('—', ':00 and ') + ':00.',
      types: T.map((t, i) => Object.assign({ n: t[0], d: t[1], toggle: () => { const x = st.types.slice(); x[i] = !x[i]; this.setState({ types: x }); } }, sw(st.types[i])))
    };
  }
}
</script>
</body>
</html>
